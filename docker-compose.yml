# One command: `docker compose up --build`
#   Web app:        http://localhost:8080
#   Sales inbox UI: http://localhost:8025  (Mailpit — catches every email locally)
#   Backend API:    http://localhost:4000/api/featured
services:
  backend:
    build: ./backend
    environment:
      PORT: 4000
      FAKESTORE_BASE_URL: ${FAKESTORE_BASE_URL:-https://fakestoreapi.com}
      FEATURED_PRODUCT_IDS: ${FEATURED_PRODUCT_IDS:-1,5,9,13,17}
      CATEGORY_TOP_RATED_COUNT: ${CATEGORY_TOP_RATED_COUNT:-3}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-300}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SALES_INBOX: ${SALES_INBOX:-sales@example.com}
      MAIL_FROM: ${MAIL_FROM:-Catalogue <no-reply@example.com>}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      - mailpit

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP (so `npm run dev` outside Docker can use it too)
